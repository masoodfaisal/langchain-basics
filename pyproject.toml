[project]
name = "agent"
version = "0.1.0"
description = "LangChain agent with MCP tools"
requires-python = ">=3.13"
dependencies = [
    "langchain~=1.3.14",
    "langchain-openai~=1.4.2",
    "langchain-mcp-adapters~=0.3.2",
    "langgraph~=1.2.10",
    "langgraph-checkpoint-sqlite~=3.1.1",
    "langgraph-cli[inmem]~=0.4.31",
    "fastapi~=0.136",
    "uvicorn[standard]~=0.38",
    "typing_extensions~=4.15",
    # Direct dependency for Keycloak JWT/JWKS verification in auth.py.
    "PyJWT[crypto]~=2.13.0",
    # Chinook support bot demo.
    "langchain-community~=0.4.2",
    "langsmith[otel]~=0.10.17",
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    # Async SQLite for the agent's DB layer (db.py / tools.py / middleware.py).
    "aiosqlite~=0.22",
    # In-process Rego evaluation for the standalone Guardian middleware demo.
    "regopy==1.5.2",
    "fastembed>=0.7,<1.0",
    "deepagents~=0.6.12",
    "tavily-python~=0.7.21",
    "harbor",
    "openevals",
    "smithtune>=0.0.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = ">=3.11"

# This repository intentionally uses a flat module layout.  Be explicit so
# deployment builds do not mistake data directories such as ``resources`` for
# Python packages during editable installation.
[tool.setuptools]
py-modules = [
    "agent",
    "billing",
    "billing_policy",
    "context",
    "db",
    "embeddings",
    "guardian",
    "memory",
    "middleware",
    "rego_policy",
    "tools",
]
packages = ["evals", "policies"]

[tool.setuptools.package-data]
policies = ["guardian.rego", "billing_guardian.rego"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a running 'langgraph dev' server (auto-skipped when no server is reachable)",
]
asyncio_mode = "auto"
